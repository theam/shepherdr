# Shepherdr Remote, the iPhone companion. Generate the Xcode project with `xcodegen` in this folder.
name: ShepherdrRemote
options:
  bundleIdPrefix: com.theagilemonkeys
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  Shepherdr:
    path: ..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.10.1
targets:
  ShepherdrRemote:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShepherdrRemote
      - path: ../Sources/ShepherdrTerminalUI/Resources/Fonts
        buildPhase: resources
        type: folder
        name: Fonts
    dependencies:
      - package: Shepherdr
        product: ShepherdrRemote
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theagilemonkeys.ShepherdrRemote$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: Shepherdr Remote
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shepherdr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Shepherdr Remote scans the pairing code your Mac shows.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Shepherdr Remote listens while you dictate a prompt.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Your iPhone turns what you dictate into a prompt, on the device.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Shepherdr Remote connects to the Shepherdr relay on your Mac.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: ShepherdrRemote/Info.plist
      properties:
        UIAppFonts:
          - Fonts/FiraCode-Regular.ttf
          - Fonts/FiraCode-Medium.ttf
          - Fonts/FiraCode-SemiBold.ttf
          - Fonts/FiraCode-Bold.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.theagilemonkeys.ShepherdrRemote.pair
            CFBundleURLSchemes: [shepherdr-remote]
schemes:
  ShepherdrRemote:
    build:
      targets:
        ShepherdrRemote: all
    run:
      config: Debug
